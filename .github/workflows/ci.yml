name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # pxs-core is a submodule of this repository: it is pinned to one of its release tags, which cannot become unreachable.
  core-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-core-pin.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt: 6.8.3
          - os: windows-latest
            qt: 6.8.3
          # Qt 6.8 links the AGL framework, gone from the macOS 26 SDK of the runner
          - os: macos-latest
            qt: 6.10.3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qtwebsockets # the WebSocket tests (the OSCQuery server, the client) are built only with it
          cache: true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  # The oldest Qt the applications build with: Debian bookworm's packages (6.4)
  oldest-qt:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake ninja-build qt6-base-dev libqt6websockets6-dev libqt6opengl6-dev libgl1-mesa-dev python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
